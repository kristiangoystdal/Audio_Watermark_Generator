name: STM32 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: 🧱 Build STM32 Firmware
    runs-on: ubuntu-latest

    steps:
    # ------------------------------------------------------------
    # 1️⃣ Checkout repository
    # ------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------------------------------------
    # 2️⃣ Install ARM GCC + Build Tools
    # ------------------------------------------------------------
    - name: Install ARM GCC Toolchain and CMake/Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-none-eabi \
          binutils-arm-none-eabi \
          cmake \
          ninja-build \
          make

    # ------------------------------------------------------------
    # 3️⃣ Configure CMake
    # ------------------------------------------------------------
    - name: Configure STM32 project
      working-directory: STM32
      run: |
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DUSE_NUCLEO_64=ON

    # ------------------------------------------------------------
    # 4️⃣ Build Firmware
    # ------------------------------------------------------------
    - name: Build firmware
      working-directory: STM32/build
      run: cmake --build . --parallel

    # ------------------------------------------------------------
    # 5️⃣ Check output files
    # ------------------------------------------------------------
    - name: Verify build outputs
      working-directory: STM32/build
      run: |
        echo "📂 Contents of build directory:"
        ls -lh .
        shopt -s nullglob
        files=(*.elf *.bin)
        if [ ${#files[@]} -eq 0 ]; then
          echo "❌ No firmware (.elf/.bin) produced!"
          exit 1
        fi
        echo "✅ Firmware files found: ${files[*]}"

    # ------------------------------------------------------------
    # 6️⃣ Convert ELF → BIN/HEX (optional but recommended)
    # ------------------------------------------------------------
    - name: Convert ELF to BIN and HEX
      working-directory: STM32/build
      run: |
        for f in *.elf; do
          base=$(basename "$f" .elf)
          arm-none-eabi-objcopy -O binary "$f" "$base.bin"
          arm-none-eabi-objcopy -O ihex "$f" "$base.hex"
        done
        ls -lh *.bin *.hex

    # ------------------------------------------------------------
    # 7️⃣ Upload artifacts for download
    # ------------------------------------------------------------
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: stm32-firmware
        path: |
          STM32/build/**/*.elf
          STM32/build/**/*.bin
          STM32/build/**/*.hex
